# NestJS API on Render. MongoDB must be Atlas (or any reachable URI) —
# local Docker Mongo is not reachable from Render.
services:
  - type: web
    name: qet3etak-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      # Set in the Render dashboard after first deploy, e.g.
      # https://qet3etak-api.onrender.com
      - key: PUBLIC_BASE_URL
        sync: false
      # mongodb+srv://... from MongoDB Atlas
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ADMIN_PHONE
        value: "0500000000"
      - key: ADMIN_PASSWORD
        value: "Admin123!"
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:admin@qet3etak.com
