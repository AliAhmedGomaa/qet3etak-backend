# NestJS API on Render.
# Use MongoDB Atlas (local Docker Mongo is not reachable from Render).
services:
  - type: web
    name: qet3etak-api
    runtime: node
    plan: free
    region: frankfurt
    # Do NOT set NODE_ENV=production at build time — that skips
    # devDependencies (@nestjs/cli, typescript) and breaks `nest build`.
    buildCommand: npm ci && npm run build
    startCommand: NODE_ENV=production npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Render injects PORT automatically — do not hardcode it.
      # Set after first deploy to the public Render URL, e.g.
      # https://qet3etak-api.onrender.com
      - key: PUBLIC_BASE_URL
        sync: false
      # mongodb+srv://USER:PASS@cluster.../qet3etak
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ADMIN_PHONE
        value: "0500000000"
      - key: ADMIN_PASSWORD
        value: "Admin123!"
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:admin@qet3etak.com
